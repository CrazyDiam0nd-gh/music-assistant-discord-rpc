[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "music-assistant-discord-rpc"
version = "0.1.0"
description = "Discord Rich Presence for Music Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pypresence>=4.6", "websockets>=12"]
keywords = ["discord", "rich-presence", "music-assistant", "home-assistant"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ma-rpc = "ma_rpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
